<style>

</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T12:00:00'),fmt=s=>pd(s).toLocaleDateString('pt-BR'),sh=s=>fmt(s).slice(0,5);
const DAYS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const REASONS=['Chuva','Feriado','Líder ausente','Doença','Evento da igreja','Outro'];
const PAL=['#4f46e5','#06b6d4','#f59e0b','#10b981','#ec4899','#8b5cf6','#ef4444'];
const today=iso(new Date());
let U=null,view='dash',F={church:'',days:60},editId=null,calM=new Date(),calSel=null,calCell='',calCh='',evForm=false,hist={cell:'',status:''},CH=[];
/* ===== FIREBASE (Authentication + Firestore) =====
   1) Cole abaixo a configuração do seu app web (Console Firebase > Configurações do projeto > Seus apps).
   2) Os dados ficam em coleções (churches, cells, members, meetings, events, leaders, visits, users, finance)
      e as regras de acesso estão em firestore.rules. As telas continuam usando o objeto S em memória;
      save() grava só o que mudou (diferenças) e os listeners mantêm tudo sincronizado em tempo real. */
const FB_CONFIG={apiKey:'COLE_AQUI',authDomain:'SEU-PROJETO.firebaseapp.com',projectId:'SEU-PROJETO',storageBucket:'SEU-PROJETO.appspot.com',messagingSenderId:'000000000000',appId:'COLE_AQUI'};
const CONFIGURED=!/COLE_AQUI/.test(FB_CONFIG.apiKey);
const S={churches:[],cells:[],members:[],meetings:[],events:[],leaders:[],visits:[],users:[]};
let _n=0;Object.defineProperty(S,'nid',{get(){return Date.now()*1000+(_n=(_n+1)%1000)},set(v){}});
let auth,db,SYN={},LST=[],pend=new Set(),ready=false,rt;
if(CONFIGURED){firebase.initializeApp(FB_CONFIG);auth=firebase.auth();db=firebase.firestore()}
const COLS=['churches','cells','members','meetings','events','leaders','visits','users','finance'];
const arr=c=>c=='finance'?FL:S[c];
function prep(c,x){const o={...x};
 if(c=='meetings'){const k=S.cells.find(y=>y.id==x.cell);o.church=k?k.church:(x.church||0)}
 if(c=='visits'){const m=S.members.find(y=>y.id==x.member);o.church=m?m.church:(x.church||0);o.cell=m?m.cell:(x.cell||0)}
 return JSON.parse(JSON.stringify(o))}
function resyn(c){SYN[c]={};arr(c).forEach(x=>SYN[c][String(x.id)]=JSON.stringify(prep(c,x)))}
function syncAll(){if(!U||!ready)return;const ops=[];
 for(const c of COLS){if(!SYN[c])continue;const seen=new Set();
  for(const x of arr(c)){const id=String(x.id),o=prep(c,x),j=JSON.stringify(o);seen.add(id);if(SYN[c][id]!==j){SYN[c][id]=j;ops.push(b=>b.set(db.collection(c).doc(id),o))}}
  for(const id of Object.keys(SYN[c]))if(!seen.has(id)){delete SYN[c][id];ops.push(b=>b.delete(db.collection(c).doc(id)))}}
 for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));
  b.commit().catch(e=>{alert(e.code=='permission-denied'?'Você não tem permissão para esta ação.':'Erro ao salvar: '+e.message);startL()})}}
const save=()=>syncAll();
function stopL(){LST.forEach(f=>f());LST=[]}
function redraw(){clearTimeout(rt);rt=setTimeout(()=>{const a=document.activeElement;if(U&&ready&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))render()},60)}
function startL(){stopL();ready=false;const R=U.role,col=n=>db.collection(n),qs={churches:col('churches'),leaders:col('leaders')};
 if(R=='admin')['cells','members','meetings','events','visits','users','finance'].forEach(n=>qs[n]=col(n));
 else{const f=R=='igreja'?'church':'cell',v=R=='igreja'?U.church:U.cell;
  qs.cells=R=='igreja'?col('cells').where('church','==',v):col('cells').where('id','==',v);
  ['members','meetings','visits'].forEach(n=>qs[n]=col(n).where(f,'==',v));
  qs.events=col('events').where('church','in',[0,U.church])}
 pend=new Set(Object.keys(qs));SYN={};
 Object.entries(qs).forEach(([c,q])=>LST.push(q.onSnapshot(s=>{const a=s.docs.map(d=>d.data());if(c=='finance')FL=a;else S[c]=a;
  if(ready){resyn(c);pend.delete(c);redraw()}else{pend.delete(c);if(!pend.size){ready=true;COLS.forEach(k=>{if(qs[k])resyn(k)});render()}}},
  e=>alert('Erro ao carregar "'+c+'": '+e.code))))}
if(CONFIGURED)auth.onAuthStateChanged(async u=>{stopL();ready=false;U=null;
 if(!u){render();return}
 try{const d=await db.collection('users').doc(u.uid).get(),p=d.exists?d.data():null;
  if(!p||!['admin','igreja','leader'].includes(p.role)){await auth.signOut();alert('Seu usuário ainda não tem perfil de acesso. Procure a coordenação.');return}
  U={...p,email:u.email,uid:u.uid};view='dash';F.church='';calCh='';calCell='';evForm=false;editId=null;startL();render()}
 catch(e){await auth.signOut();alert('Erro ao entrar: '+e.message)}});
function logout(){auth.signOut()}
async function mkLogin(em,pw){let app;try{app=firebase.app('sec')}catch(e){app=firebase.initializeApp(FB_CONFIG,'sec')}
 const a=app.auth(),c=await a.createUserWithEmailAndPassword(em,pw);await a.signOut();return c.user.uid}
function login(){const e=$('#e').value.trim(),p=$('#p').value,er=m=>$('#err').textContent=m;
 if(!CONFIGURED)return er('Configure o Firebase no início do código (FB_CONFIG).');if(!e||!p)return er('Informe e-mail e senha.');er('');
 auth.signInWithEmailAndPassword(e,p).catch(()=>er('E-mail ou senha incorretos.'))}
const firstRun=()=>`<div class="card"><h3>Bem-vindo(a)!</h3><p>O banco de dados está vazio. Crie a estrutura inicial (igrejas MS2, MS3 e MS4 e as células) ou cadastre tudo na aba Cadastros.</p><button class="b" onclick="firstSeed()">Criar estrutura inicial</button> <button class="b g" onclick="view='cad';render()">Ir para Cadastros</button></div>`;
function firstSeed(){const ch=[2,3,4].map(i=>({id:S.nid++,name:'MS'+i}));S.churches.push(...ch);
 [['Cartas Vivas',0,5],['DNA',0,6],['Inconformados',1,4],['Leão de Judá',2,5]].forEach(([n,i,d])=>S.cells.push({id:S.nid++,name:n,church:ch[i].id,leader:'',day:d,time:'19:30',place:''}));save();render()}
const SL={ativo:'Ativo',convertido:'Novo convertido',afastado:'Afastado'};
function myChurch(){return U.role=='igreja'?U.church:U.cell?cellOf(U.cell).church:0}
function inScope(m){return U.role=='admin'||(U.role=='igreja'?m.church==U.church:m.cell==U.cell)}
function syncCh(){const c=+$('#mc').value,h=$('#mh');if(!h)return;if(c){h.value=cellOf(c).church;h.disabled=true}else h.disabled=false}
const ex=m=>m.exp||cellMembers(m.cell).length;
const lv=m=>S.visits.filter(v=>v.member==m.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
let VF=null;
function visitForm(){return `<div style="margin-top:8px"><div class="row"><div><label>Responsável</label><input id="vw" value="${U.name.split(' (')[0]}"></div><div><label>Data</label><input id="vd" type="date" value="${today}"></div><div><label>Situação</label><select id="vs"><option value="agendada">Agendada</option><option value="realizada">Realizada</option></select></div></div><label>Observações</label><input id="vo"><label class="chk"><input type="checkbox" id="vb"> Voltou a participar</label><br><button class="b" onclick="saveVisit()">Salvar visita</button> <button class="b g" onclick="VF=null;render()">Cancelar</button></div>`}
function saveVisit(){S.visits.push({id:S.nid++,member:VF,who:$('#vw').value,date:$('#vd').value,status:$('#vs').value,notes:$('#vo').value});if($('#vb').checked){const m=S.members.find(x=>x.id==VF);m.status='ativo';m.active=true;delete m.awaySince}VF=null;save();render()}
function heat(cs){const W=[],b=new Date();b.setDate(b.getDate()-b.getDay()-49);for(let i=0;i<8;i++){const d=new Date(b);d.setDate(d.getDate()+7*i);W.push(iso(d))}
 const wkOf=s=>{const d=pd(s);d.setDate(d.getDate()-d.getDay());return iso(d)},col=v=>v>=75?'22,163,74':v>=50?'245,158,11':'220,38,38';
 return `<div class="wrap"><table style="text-align:center"><tr><th></th>${W.map(w=>`<th style="text-align:center">${sh(w)}</th>`).join('')}</tr>${cs.map(c=>`<tr><td style="text-align:left;white-space:nowrap"><b>${c.name}</b></td>${W.map(w=>{const l=S.meetings.filter(m=>m.cell==c.id&&wkOf(m.date)==w&&m.date<=today),d=l.filter(done);if(d.length){const p=pct(d.reduce((a,m)=>a+m.present.length,0),d.reduce((a,m)=>a+ex(m),0));return `<td style="background:rgba(${col(p)},.3);font-weight:600" title="${p}% de frequência">${p}%</td>`}if(l.some(m=>m.status=='missed'))return `<td style="background:rgba(120,120,140,.25)" title="Não realizada: ${l[0].reason||''}">✕</td>`;return '<td class="mu">–</td>'}).join('')}</tr>`).join('')}</table></div><div class="mu" style="margin-top:6px">Verde ≥75% · Amarelo 50–74% · Vermelho &lt;50% · ✕ não realizada · – sem registro</div>`}
const cellOf=id=>S.cells.find(c=>c.id==id),chOf=id=>S.churches.find(c=>c.id==id)||{name:'—'};
const myCells=()=>S.cells.filter(c=>U.role=='admin'||c.id==U.cell||(U.role=='igreja'&&c.church==U.church));
const scoped=()=>myCells().filter(c=>!F.church||c.church==F.church);
const pct=(a,b)=>b?Math.round(a/b*100):0,done=m=>m.status=='done';
const cellMembers=id=>S.members.filter(m=>m.cell==id&&m.active);
const toggleTheme=()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';render()};
function render(){
 CH.forEach(c=>c.destroy());CH=[];
 if(U&&!ready){A.innerHTML='<div class="card" style="margin:20px">Carregando dados…</div>';return}
 if(!U){A.innerHTML=`<div id="login" class="card"><h2 style="margin-top:0">Submersos</h2><label>E-mail</label><input id="e" type="email"><label>Senha</label><input id="p" type="password" onkeydown="if(event.key=='Enter')login()"><p id="err" style="color:var(--no);font-size:13px"></p><button class="b" onclick="login()" style="width:100%">Entrar</button>
 <p class="mu" style="margin:0">Acesso restrito. Peça seu login à coordenação.</p></div>`;return}
 const tabs=[['dash','📊','Painel'],['cal','📅','Agenda'],['reg','✍️','Lançar'],['hist','🗂️','Histórico'],['cad','👥','Cadastros']].concat(U.role=='admin'?[['fin','💰','Finanças']]:[]);
 A.innerHTML=`<header><b>${U.name}</b><button class="b g" onclick="toggleTheme()">🌓</button><button class="b g" onclick="logout()">Sair</button></header><main id="v"></main><nav>${tabs.map(t=>`<button class="${view==t[0]?'on':''}" onclick="view='${t[0]}';editId=null;render()"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
 ({dash,cal,reg,hist:histV,cad,fin})[view]();}
function filters(){return `<div class="row np" style="margin-bottom:12px">${U.role=='admin'?`<div><label>Igreja</label><select onchange="F.church=this.value;render()"><option value="">Todas</option>${S.churches.map(c=>`<option value="${c.id}" ${F.church==c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>`:''}<div><label>Período</label><select onchange="F.days=+this.value;render()">${[30,60,90,365].map(d=>`<option value="${d}" ${F.days==d?'selected':''}>${d} dias</option>`).join('')}</select></div><button class="b g" onclick="exportCsv()">⬇ Excel (CSV)</button><button class="b g" onclick="print()">🖨 PDF</button></div>`}
function mk(id,type,data,x={}){const e=$('#'+id);if(!e||typeof Chart=='undefined')return;
 const cs=getComputedStyle(document.documentElement);Chart.defaults.color=cs.getPropertyValue('--mu').trim();Chart.defaults.borderColor=cs.getPropertyValue('--bd').trim();Chart.defaults.font.size=12;
 CH.push(new Chart(e,{type,data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type=='doughnut'||!!x.leg,position:'bottom',labels:{usePointStyle:true,boxWidth:8}}},...x.o}}))}
const box=(id,t)=>`<div class="card"><h3>${t}</h3><div class="ch"><canvas id="${id}"></canvas></div></div>`;
function dash(){if(U.role=='admin'&&!S.churches.length){$('#v').innerHTML=firstRun();return}

 const cs=scoped(),ids=cs.map(c=>c.id),lim=new Date();lim.setDate(lim.getDate()-F.days);
 const ms=S.meetings.filter(m=>ids.includes(m.cell)&&m.date<=today&&m.date>=iso(lim)),dn=ms.filter(done),mi=ms.filter(m=>m.status=='missed');
 const mem=S.members.filter(m=>ids.includes(m.cell)&&m.active);
 const tot=dn.reduce((a,m)=>a+ex(m),0),pr=dn.reduce((a,m)=>a+m.present.length,0),vis=dn.reduce((a,m)=>a+(+m.visitors||0),0);
 const pl=new Date(lim);pl.setDate(pl.getDate()-F.days);
 const pm=S.meetings.filter(m=>ids.includes(m.cell)&&m.date<iso(lim)&&m.date>=iso(pl)),pdn=pm.filter(done);
 const pf=pct(pdn.reduce((a,m)=>a+m.present.length,0),pdn.reduce((a,m)=>a+ex(m),0)),pv=pdn.reduce((a,m)=>a+(+m.visitors||0),0);
 const dl=(a,b,u='')=>pm.length?`<div class="mu" style="color:var(--${a>=b?'ok':'no'})">${a>b?'▲':a<b?'▼':'●'} ${Math.abs(a-b)}${u} vs período anterior</div>`:'<div class="mu">sem período anterior</div>';
 const byCell=cs.map(c=>{const d=dn.filter(m=>m.cell==c.id);return{c,f:pct(d.reduce((a,m)=>a+m.present.length,0),d.reduce((a,m)=>a+ex(m),0)),ok:d.length,no:mi.filter(m=>m.cell==c.id).length}}).sort((a,b)=>b.f-a.f);
 const wk={};dn.forEach(m=>{const d=pd(m.date);d.setDate(d.getDate()-d.getDay());const k=iso(d),w=wk[k]=wk[k]||{p:0,t:0,v:0};w.p+=m.present.length;w.t+=ex(m);w.v+=+m.visitors||0});
 const wks=Object.keys(wk).sort(),rs={};mi.forEach(m=>rs[m.reason]=(rs[m.reason]||0)+1);
 const absent=[];mem.forEach(m=>{const l=S.meetings.filter(x=>x.cell==m.cell&&done(x)).sort((a,b)=>b.date.localeCompare(a.date));let n=0;for(const x of l){if(x.present.includes(m.id))break;n++}if(n>=3)absent.push(`${m.name} — ${n} faltas seguidas (${cellOf(m.cell).name})`)});
 const stale=cs.filter(c=>{const l=S.meetings.filter(x=>x.cell==c.id&&x.status!='scheduled'&&x.date<=today).map(x=>x.date).sort().pop();return !l||(new Date(today)-new Date(l))/864e5>15}).map(c=>c.name+' — sem registro há mais de 15 dias');
 const chs=S.churches.filter(c=>U.role=='admin'&&(!F.church||c.id==F.church));
 const sc=S.members.filter(m=>inScope(m)&&(!F.church||m.church==F.church)),mo=new Date().getMonth()+1,yr=new Date().getFullYear(),bd=sc.filter(m=>m.birth&&+m.birth.slice(5,7)==mo).sort((a,b)=>a.birth.slice(8)-b.birth.slice(8)),aw=sc.filter(m=>m.status=='afastado'),loc=m=>`${chOf(m.church).name} · ${m.cell?cellOf(m.cell).name:'Sem célula'} · ${m.phone||'sem telefone'}`;

 ${adm?`<div class="card"><h3>Nova célula</h3><div class="row"><div><label>Nome</label><input id="cn"></div><div><label>Igreja</label><select id="cc">${S.churches.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div><label>Líder</label><input id="cl"></div><div><label>Dia</label><select id="cd">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></div></div><div class="row"><div><label>E-mail de login do líder</label><input id="cem" type="email"></div><div><label>Senha do líder</label><input id="cpw"></div></div><p id="err2" style="color:var(--no)"></p><button class="b" onclick="addCell()">Adicionar célula</button></div>`:''}
 <div class="card"><h3>Células (${myCells().length})</h3><div class="wrap"><table><tr><th>Célula</th><th>Igreja</th><th>Líder</th><th>Dia</th><th>Membros</th>${adm?'<th></th>':''}</tr>${myCells().map(c=>`<tr><td>${c.name}</td><td>${chOf(c.church).name}</td><td>${c.leader}</td><td>${DAYS[c.day]}</td><td>${cellMembers(c.id).length}</td>${adm?`<td><button class="b r" onclick="delCell(${c.id})">Excluir</button></td>`:''}</tr>`).join('')}</table></div></div>
 <div class="card"><h3>Membros (${mem.length})</h3><div class="wrap"><table><tr><th>Nome</th><th>Telefone</th><th>Nascimento</th><th>Igreja / Célula</th><th>Situação</th>${adm?'<th></th>':''}</tr>${mem.map(m=>`<tr><td>${m.name}</td><td>${m.phone||''}</td><td><input type="date" value="${m.birth||''}" style="min-width:130px" onchange="S.members.find(x=>x.id==${m.id}).birth=this.value;save()"></td><td>${chOf(m.church).name} · ${U.role!='leader'?`<select style="width:auto" onchange="mvMember(${m.id},this.value)"><option value="0">Sem célula</option>${S.cells.filter(c=>c.church==m.church).map(c=>`<option value="${c.id}" ${m.cell==c.id?'selected':''}>${c.name}</option>`).join('')}</select>`:cellOf(m.cell).name}</td><td><select style="width:auto" onchange="setStatus(${m.id},this.value)">${Object.entries(SL).map(([k,v])=>`<option value="${k}" ${m.status==k?'selected':''}>${v}</option>`).join('')}</select></td>${adm?`<td><button class="b r" onclick="delMember(${m.id})">Excluir</button></td>`:''}</tr>`).join('')}</table></div><p class="mu">Dados pessoais: use apenas com consentimento (LGPD).</p></div>`;syncCh()}
function addMember(){const n=$('#mn').value.trim();if(n.length<3)return $('#err').textContent='Informe o nome completo.';const c=+$('#mc').value,st=$('#ms').value;S.members.push({id:S.nid++,name:n,phone:$('#mp').value,birth:$('#mb').value,status:st,cell:c,church:c?cellOf(c).church:+$('#mh').value,active:st!='afastado',awaySince:st=='afastado'?today:undefined});save();cad()}
function setStatus(id,v){const m=S.members.find(x=>x.id==id);m.status=v;m.active=v!='afastado';if(v=='afastado')m.awaySince=today;else delete m.awaySince;save();cad()}
function addLeader(){const n=$('#ln').value.trim(),em=$('#le').value.trim().toLowerCase(),pw=$('#lw').value,er=m=>$('#err3').textContent=m;if(n.length<3)return er('Informe o nome do líder.');
 if(em&&(pw.length<6||S.users.some(u=>u.email==em)))return er('Informe uma senha de 6+ caracteres e um e-mail ainda não usado.');
 const id=S.nid++,ch=+$('#lc').value;S.leaders.push({id,name:n,phone:$('#lp').value,church:ch,email:em});save();cad();
 if(em)mkLogin(em,pw).then(uid=>{S.users.push({id:uid,email:em,role:'igreja',name:n+' (Líder de jovens)',church:ch,leaderId:id});save();alert('Login criado para '+em)}).catch(e=>alert('Líder cadastrado, mas o login falhou: '+e.message))}
function delLeader(id){if(confirm('Excluir este líder e o login dele?')){S.leaders=S.leaders.filter(l=>l.id!=id);S.users=S.users.filter(u=>u.leaderId!=id);save();cad()}}
function mvMember(id,v){S.members.find(x=>x.id==id).cell=+v;save();cad()}
function addCell(){const n=$('#cn').value.trim(),em=$('#cem').value.trim().toLowerCase(),pw=$('#cpw').value,er=m=>$('#err2').textContent=m;if(!n)return er('Informe o nome da célula.');
 if(em&&(pw.length<6||S.users.some(u=>u.email==em)))return er('Informe uma senha de 6+ caracteres e um e-mail ainda não usado.');
 const id=S.nid++,ch=+$('#cc').value,ld=$('#cl').value;S.cells.push({id,name:n,church:ch,leader:ld,day:+$('#cd').value,time:'19:30',place:''});save();cad();
 if(em)mkLogin(em,pw).then(uid=>{S.users.push({id:uid,email:em,role:'leader',name:(ld||n)+' (Líder)',cell:id,church:ch});save();alert('Login criado para '+em)}).catch(e=>alert('Célula criada, mas o login falhou: '+e.message))}
function addChurch(){const n=$('#chn').value.trim();if(!n)return;S.churches.push({id:S.nid++,name:n});save();cad()}
function rmCell(id){S.cells=S.cells.filter(c=>c.id!=id);S.members=S.members.filter(m=>m.cell!=id);S.meetings=S.meetings.filter(m=>m.cell!=id);S.users=S.users.filter(u=>u.cell!=id)}
function delCell(id){if(confirm('Excluir a célula "'+cellOf(id).name+'" com seus membros, reuniões e o login do líder?')){rmCell(id);save();cad()}}
function delMember(id){if(confirm('Excluir este membro?')){S.members=S.members.filter(m=>m.id!=id);S.meetings.forEach(m=>m.present=m.present.filter(i=>i!=id));save();cad()}}
function delChurch(id){const c=chOf(id);if(confirm('Excluir a igreja '+c.name+' e todas as suas células, membros, reuniões e eventos?')){S.cells.filter(x=>x.church==id).forEach(x=>rmCell(x.id));S.events=S.events.filter(e=>e.church!=id);S.members=S.members.filter(m=>m.church!=id);S.leaders=S.leaders.filter(l=>l.church!=id);S.users=S.users.filter(u=>u.church!=id);S.churches=S.churches.filter(x=>x.id!=id);if(F.church==id)F.church='';save();cad()}}
/* ===== MÓDULO FINANCEIRO (acesso: administrador) =====
   Dados na coleção 'finance' do Firestore (somente administrador, conforme firestore.rules). */
const FIN_KEY='jv_fin1',MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CAT={in:['Dízimos e ofertas','Contribuições dos jovens','Doações','Arrecadação de eventos','Outras receitas'],out:['Eventos e congressos','Alimentação','Transporte','Materiais e equipamentos','Decoração','Despesas administrativas','Outras despesas']};
const PAGTO=['Dinheiro','PIX','Transferência','Cartão'];
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FinStore={save(){syncAll()}};
let FL=[],FV='dash',FE=null,FF={y:'',m:'',from:'',to:'',type:'',cat:''};
function parseBRL(s){s=String(s).replace(/[R$\s]/g,'');let n;if(/^\d{1,3}(\.\d{3})*(,\d{1,2})?$/.test(s))n=s.replace(/\./g,'').replace(',','.');else if(/^\d+([.,]\d{1,2})?$/.test(s))n=s.replace(',','.');else return NaN;return Math.round(parseFloat(n)*100)}
const finList=()=>FL.filter(e=>(!FF.y||e.date.slice(0,4)==FF.y)&&(!FF.m||e.date.slice(5,7)==FF.m)&&(!FF.from||e.date>=FF.from)&&(!FF.to||e.date<=FF.to)&&(!FF.type||e.type==FF.type)&&(!FF.cat||e.cat==FF.cat)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
const sums=l=>{const i=l.filter(e=>e.type=='in').reduce((a,e)=>a+e.v,0),o=l.filter(e=>e.type=='out').reduce((a,e)=>a+e.v,0);return{i,o,s:i-o}};
const finTot=t=>`<p style="margin:10px 0 0">Entradas <b class="pos">${brl(t.i)}</b> · Saídas <b class="neg">${brl(t.o)}</b> · Saldo <b class="${t.s<0?'neg':'pos'}">${brl(t.s)}</b></p>`;
function fin(){
 if(U.role!='admin'){$('#v').innerHTML='<div class="card">Acesso restrito à coordenação geral.</div>';return}
 const l=finList(),t=sums(l);
 $('#v').innerHTML=finTabs()+finFilters()+(FV=='lan'?finLan(l,t):FV=='rel'?finRel(l,t):finDash(l,t));
 if(FV=='dash'&&l.length)finCharts(l)}
const finTabs=()=>`<div class="row np" style="margin-bottom:12px">${[['dash','📊 Painel'],['lan','✍️ Lançamentos'],['rel','🧾 Relatório']].map(t=>`<button class="b ${FV==t[0]?'':'g'}" onclick="FV='${t[0]}';FE=null;render()">${t[1]}</button>`).join('')}</div>`;
function finFilters(){const ys=[...new Set(FL.map(e=>e.date.slice(0,4)).concat(String(new Date().getFullYear())))].sort().reverse();
 return `<div class="card np"><div class="row"><div><label>Ano</label><select onchange="FF.y=this.value;render()"><option value="">Todos</option>${ys.map(y=>`<option ${FF.y==y?'selected':''}>${y}</option>`).join('')}</select></div><div><label>Mês</label><select onchange="FF.m=this.value;render()"><option value="">Todos</option>${MESES.map((n,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${FF.m==v?'selected':''}>${n}</option>`}).join('')}</select></div><div><label>De</label><input type="date" value="${FF.from}" onchange="FF.from=this.value;render()"></div><div><label>Até</label><input type="date" value="${FF.to}" onchange="FF.to=this.value;render()"></div></div>
 <div class="row"><div><label>Tipo</label><select onchange="FF.type=this.value;render()"><option value="">Todos</option><option value="in" ${FF.type=='in'?'selected':''}>Entradas</option><option value="out" ${FF.type=='out'?'selected':''}>Saídas</option></select></div><div><label>Categoria</label><select onchange="FF.cat=this.value;render()"><option value="">Todas</option>${[...CAT.in,...CAT.out].map(c=>`<option ${FF.cat==c?'selected':''}>${c}</option>`).join('')}</select></div><button class="b g" style="flex:0;white-space:nowrap" onclick="FF={y:'',m:'',from:'',to:'',type:'',cat:''};render()">Limpar filtros</button></div></div>`}
function finDash(l,t){return `<div class="grid"><div class="card kpi" style="border-left-color:var(--ok)"><div class="mu">Total de entradas</div><div class="big pos">${brl(t.i)}</div></div><div class="card kpi" style="border-left-color:var(--no)"><div class="mu">Total de saídas</div><div class="big neg">${brl(t.o)}</div></div><div class="card kpi"><div class="mu">Saldo atual</div><div class="big ${t.s<0?'neg':'pos'}">${brl(t.s)}</div></div><div class="card kpi" style="border-left-color:var(--sc)"><div class="mu">Total de lançamentos</div><div class="big">${l.length}</div></div></div>
 ${l.length?`${box('f1','Entradas × saídas por mês')}<div class="grid g2">${box('f2','Despesas por categoria')}${box('f3','Evolução do saldo')}</div>`:'<div class="card mu">Nenhum lançamento no filtro selecionado.</div>'}`}
function finCharts(l){const mo={};l.forEach(e=>{const k=e.date.slice(0,7),m=mo[k]=mo[k]||{i:0,o:0};m[e.type=='in'?'i':'o']+=e.v});
 const ks=Object.keys(mo).sort(),lb=ks.map(k=>k.slice(5)+'/'+k.slice(0,4));let acc=0;const bal=ks.map(k=>(acc+=mo[k].i-mo[k].o)/100);
 const cat={};l.filter(e=>e.type=='out').forEach(e=>cat[e.cat]=(cat[e.cat]||0)+e.v);
 const lg=on=>({display:on,position:'bottom',labels:{usePointStyle:true,boxWidth:8}}),tk={callback:v=>'R$ '+v.toLocaleString('pt-BR')};
 const tip=(f)=>({callbacks:{label:f}});
 mk('f1','bar',{labels:lb,datasets:[{label:'Entradas',data:ks.map(k=>mo[k].i/100),backgroundColor:'#16a34a',borderRadius:6},{label:'Saídas',data:ks.map(k=>mo[k].o/100),backgroundColor:'#dc2626',borderRadius:6}]},{o:{plugins:{legend:lg(true),tooltip:tip(c=>c.dataset.label+': '+brl(c.raw*100))},scales:{y:{beginAtZero:true,ticks:tk}}}});
 mk('f2','doughnut',{labels:Object.keys(cat),datasets:[{data:Object.values(cat).map(v=>v/100),backgroundColor:PAL,borderWidth:0}]},{o:{cutout:'62%',plugins:{legend:lg(true),tooltip:tip(c=>c.label+': '+brl(c.raw*100))}}});
 mk('f3','line',{labels:lb,datasets:[{label:'Saldo acumulado',data:bal,borderColor:'#4f46e5',backgroundColor:'rgba(79,70,229,.15)',fill:true,tension:.3,pointRadius:4}]},{o:{plugins:{legend:lg(false),tooltip:tip(c=>'Saldo: '+brl(c.raw*100))},scales:{y:{ticks:tk}}}})}
function finTable(l,act){return `<div class="wrap"><table><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Pagamento</th><th>Valor</th><th>Responsável</th>${act?'<th class="np"></th>':''}</tr>${l.map(e=>`<tr><td>${fmt(e.date)}</td><td>${esc(e.desc)}<br><span class="mu">${esc(e.cat)}${e.obs?' · '+esc(e.obs):''}</span></td><td><span class="tag ${e.type=='in'?'ok':'no'}">${e.type=='in'?'Entrada':'Saída'}</span></td><td>${esc(e.pay)}</td><td class="${e.type=='in'?'pos':'neg'}" style="white-space:nowrap"><b>${e.type=='in'?'+':'−'} ${brl(e.v)}</b></td><td>${esc(e.by)}</td>${act?`<td class="np" style="white-space:nowrap"><button class="b g" onclick="FE=${e.id};render()">✏️</button> <button class="b g" onclick="finDel(${e.id})">🗑</button></td>`:''}</tr>`).join('')||`<tr><td colspan="7" class="mu">Nenhum lançamento.</td></tr>`}</table></div>`}
function finLan(l,t){const e=FE?FL.find(x=>x.id==FE):null,tp=e?e.type:'in';
 return `<div class="card np"><h3>${e?'Editar':'Novo'} lançamento</h3><div class="row"><div><label>Tipo *</label><select id="ft" onchange="finCats()"><option value="in" ${tp=='in'?'selected':''}>Entrada</option><option value="out" ${tp=='out'?'selected':''}>Saída</option></select></div><div><label>Data *</label><input id="fd" type="date" value="${e?e.date:today}"></div><div><label>Valor (R$) *</label><input id="fv" inputmode="decimal" placeholder="0,00" value="${e?(e.v/100).toFixed(2).replace('.',','):''}"></div></div>
 <div class="row"><div><label>Categoria *</label><select id="fc">${CAT[tp].map(c=>`<option ${e&&e.cat==c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Forma de pagamento *</label><select id="fp">${PAGTO.map(p=>`<option ${e&&e.pay==p?'selected':''}>${p}</option>`).join('')}</select></div><div><label>Responsável *</label><input id="fr" maxlength="60" value="${esc(e?e.by:U.name)}"></div></div>
 <label>Descrição *</label><input id="fx" maxlength="120" value="${esc(e?e.desc:'')}"><label>Observações (opcional)</label><textarea id="fo" maxlength="300">${esc(e?e.obs:'')}</textarea><p id="ferr" style="color:var(--no)"></p><button class="b" onclick="finSave()">${e?'Salvar alterações':'Adicionar lançamento'}</button> ${e?`<button class="b g" onclick="FE=null;render()">Cancelar</button>`:''}</div>
 <div class="card"><h3>Extrato (${l.length})</h3>${finTable(l,true)}${finTot(t)}</div>`}
function finCats(){$('#fc').innerHTML=CAT[$('#ft').value].map(c=>`<option>${c}</option>`).join('')}
function finSave(){const v=parseBRL($('#fv').value),d=$('#fd').value,x=$('#fx').value.trim(),r=$('#fr').value.trim(),er=m=>$('#ferr').textContent=m;
 if(!d)return er('Informe a data.');if(x.length<3)return er('Informe a descrição (mínimo 3 caracteres).');if(!(v>0))return er('Informe um valor válido maior que zero (ex.: 150,00).');if(v>1e11)return er('Valor muito alto.');if(!r)return er('Informe o responsável.');
 const o={date:d,type:$('#ft').value,desc:x,cat:$('#fc').value,v,pay:$('#fp').value,by:r,obs:$('#fo').value.trim()};
 if(FE)Object.assign(FL.find(e=>e.id==FE),o);else FL.push({id:Date.now(),...o});
 FinStore.save(FL);FE=null;render()}
function finDel(id){if(confirm('Excluir este lançamento? Esta ação não pode ser desfeita.')){FL=FL.filter(e=>e.id!=id);FinStore.save(FL);if(FE==id)FE=null;render()}}
function finRel(l,t){const per=FF.from||FF.to?`${FF.from?fmt(FF.from):'início'} a ${FF.to?fmt(FF.to):'hoje'}`:FF.y||FF.m?`${FF.m?MESES[+FF.m-1]+' ':''}${FF.y}`:'Todo o período';
 const gt=(ty,tot)=>{const g={};l.filter(e=>e.type==ty).forEach(e=>g[e.cat]=(g[e.cat]||0)+e.v);return `<table><tr><th>Categoria</th><th style="text-align:right">Valor</th><th style="text-align:right">%</th></tr>${Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td>${esc(c)}</td><td style="text-align:right">${brl(v)}</td><td style="text-align:right">${pct(v,tot)}%</td></tr>`).join('')||'<tr><td colspan="3" class="mu">—</td></tr>'}</table>`};
 return `<div class="row np" style="margin-bottom:12px"><button class="b g" onclick="finCsv()">⬇ Exportar CSV (Excel)</button><button class="b" onclick="print()">🖨 Imprimir relatório</button></div>
 <div class="card"><h2 style="margin:0">Relatório Financeiro</h2><div class="mu">Departamento de Jovens · Período: ${per}${FF.type||FF.cat?' · filtros aplicados':''} · Emitido em ${fmt(today)}</div>
 <div class="grid" style="margin:12px 0"><div class="card kpi" style="border-left-color:var(--ok)"><div class="mu">Entradas</div><div class="big pos">${brl(t.i)}</div></div><div class="card kpi" style="border-left-color:var(--no)"><div class="mu">Saídas</div><div class="big neg">${brl(t.o)}</div></div><div class="card kpi"><div class="mu">Saldo final</div><div class="big ${t.s<0?'neg':'pos'}">${brl(t.s)}</div></div></div>
 <div class="grid g2"><div><h3>Entradas por categoria</h3>${gt('in',t.i)}</div><div><h3>Saídas por categoria</h3>${gt('out',t.o)}</div></div>
 <h3 style="margin-top:14px">Extrato</h3>${finTable(l,false)}<p style="font-size:17px;text-align:right">Saldo final: <b class="${t.s<0?'neg':'pos'}">${brl(t.s)}</b></p></div>`}
function finCsv(){const l=finList().slice().reverse(),t=sums(l),n=c=>(c/100).toFixed(2).replace('.',','),q=s=>{s=String(s==null?'':s);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 const rows=[['Data','Tipo','Categoria','Descrição','Valor (R$)','Forma de pagamento','Responsável','Observações'],...l.map(e=>[fmt(e.date),e.type=='in'?'Entrada':'Saída',e.cat,e.desc,(e.type=='out'?'-':'')+n(e.v),e.pay,e.by,e.obs||''])];
 const body=rows.map((r,ri)=>r.map((x,i)=>ri&&i==4?x:q(x)).join(';'));body.push('',';;;"Total de entradas";'+n(t.i),';;;"Total de saídas";-'+n(t.o),';;;"Saldo";'+(t.s<0?'-':'')+n(Math.abs(t.s)));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+body.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='financeiro-jovens.csv';a.click()}
render();
</script></body></html>
