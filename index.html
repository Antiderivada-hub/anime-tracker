<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anime Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d17;--card:#1a1726;--card2:#231f33;--tx:#f1eefb;--mut:#a39db8;--ac:#a78bfa;--ac2:#7c5cf0;--bd:#322d47;--ok:#4ade80;--warn:#fbbf24;--bad:#fb7185;--blue:#60a5fa;--r:16px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f4fc;--card:#fff;--card2:#efeafb;--tx:#1d1830;--mut:#625b7a;--ac:#6d3fe0;--ac2:#5a2fc8;--bd:#ddd6f0}}
:root[data-theme="light"]{--bg:#f6f4fc;--card:#fff;--card2:#efeafb;--tx:#1d1830;--mut:#625b7a;--ac:#6d3fe0;--ac2:#5a2fc8;--bd:#ddd6f0}
:root[data-theme="dark"]{--bg:#0f0d17;--card:#1a1726;--card2:#231f33;--tx:#f1eefb;--mut:#a39db8;--ac:#a78bfa;--ac2:#7c5cf0;--bd:#322d47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'DM Sans',system-ui,sans-serif}
h1,h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:26px;flex:1;letter-spacing:-.5px}h1 span{color:var(--ac)}
.btn{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:500}
.btn:hover{border-color:var(--ac)}
.pri{background:var(--ac2);border-color:var(--ac2);color:#fff;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs .btn[aria-selected=true]{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.bar input[type=search]{grid-column:1/-1}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:70px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
.card.out{opacity:0;transform:scale(.9);transition:.25s}
.cv{aspect-ratio:2/3;position:relative;display:grid;place-items:center;font:800 56px 'Bricolage Grotesque';color:#fff9;background-size:cover;background-position:center}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fav{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:20px}
.fav.on{color:var(--bad)}
.badge{position:absolute;left:8px;bottom:8px;font:700 11px 'DM Sans';padding:3px 9px;border-radius:99px;background:#000b;color:#fff;border:1px solid currentColor}
.b-watching{color:var(--blue)}.b-done{color:var(--ok)}.b-plan{color:var(--mut)}.b-hold{color:var(--warn)}.b-drop{color:var(--bad)}
.info{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.tt{font-weight:700;line-height:1.25}
.meta{color:var(--mut);font-size:13px;display:flex;justify-content:space-between}
.pg{height:8px;background:var(--card2);border-radius:9px;overflow:hidden}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:9px;transition:width .4s}
.tags{display:flex;flex-wrap:wrap;gap:4px}.tags span{font-size:11px;background:var(--card2);padding:2px 8px;border-radius:99px;color:var(--mut)}
.acts{display:flex;gap:6px;margin-top:auto}.acts .btn{flex:1;padding:8px;font-size:13px;min-height:40px}
.list .grid{grid-template-columns:1fr}
.list .card{flex-direction:row}.list .cv{width:76px;aspect-ratio:2/3;font-size:28px;flex:none}
.list .fav,.list .badge{display:none}
.cm{color:var(--mut);font-size:13px;font-style:italic}
.empty{text-align:center;padding:48px 16px;color:var(--mut)}.empty b{display:block;font:800 22px 'Bricolage Grotesque';color:var(--tx);margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px}.st b{display:block;font:800 28px 'Bricolage Grotesque';color:var(--ac)}.st span{color:var(--mut);font-size:13px}
.pan{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px}.pan h2{font-size:18px;margin-bottom:10px}
.row{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.row .pg{height:12px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--bd)}.tl li{padding:6px 0 6px 10px;position:relative}.tl li:before{content:"";position:absolute;left:-21px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
dialog{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:20px;padding:0;width:min(560px,100%);max-height:92vh}
dialog::backdrop{background:#000a}
@media(max-width:600px){dialog{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0;border:0}}
.fm{padding:18px;display:grid;gap:12px;grid-template-columns:1fr 1fr}.fm h2{grid-column:1/-1}.fm .full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:13px;color:var(--mut);font-weight:500}
.fa{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg);padding:8px 0}
@media(min-width:700px){.bar{grid-template-columns:2fr 1fr 1fr 1fr 1fr auto}.bar input[type=search]{grid-column:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.jk{display:flex;gap:8px}.jk input{flex:1}
.jr{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.jr button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px;min-height:56px}
.jr button:hover{border-color:var(--ac)}.jr img{width:36px;height:52px;object-fit:cover;border-radius:6px;background:var(--card2)}
.jr small{color:var(--mut);display:block}.jm{font-size:13px;color:var(--mut);margin-top:6px}
.gsel{display:grid;gap:6px}.gsel>span{font-size:13px;color:var(--mut);font-weight:500}
details#gd{background:var(--card);border:1px solid var(--bd);border-radius:12px}
#gd summary{min-height:44px;padding:10px 12px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
#gd summary::-webkit-details-marker{display:none}#gd summary:after{content:"▾";color:var(--mut)}#gd[open] summary:after{content:"▴"}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px 8px 10px;max-height:230px;overflow-y:auto;border-top:1px solid var(--bd)}
.ck{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px;min-height:40px;cursor:pointer}
.ck input{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--ac2);flex:none}
.am{padding:18px;display:grid;gap:12px}.am p{margin:0;color:var(--mut);font-size:13px}.am .er{color:var(--bad);min-height:18px}
dialog#ad{width:min(420px,100%)}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1>Anime<span>Tracker</span></h1>
 <button class="btn" id="th" aria-label="Alternar tema">🌓</button>
 <button class="btn" id="cl" hidden>☁ Entrar</button>
 <button class="btn" id="ex">Exportar</button>
 <button class="btn" id="im">Importar</button>
 <input type="file" id="fi" accept=".json" class="sr" aria-label="Arquivo JSON">
 <button class="btn pri" id="add">+ Adicionar</button>
</header>
<div id="cs" class="cm" style="margin:-6px 0 10px" role="status"></div>
<div class="tabs" role="tablist">
 <button class="btn" role="tab" id="t1" aria-selected="true">Biblioteca</button>
 <button class="btn" role="tab" id="t2" aria-selected="false">Estatísticas</button>
</div>

<section id="lib">
 <div class="bar">
  <input type="search" id="q" placeholder="Buscar por título…" aria-label="Buscar por título">
  <select id="fs" aria-label="Status"></select>
  <select id="fg" aria-label="Gênero"></select>
  <select id="fr" aria-label="Nota mínima"><option value="0">Qualquer nota</option><option value="6">Nota ≥ 6</option><option value="8">Nota ≥ 8</option><option value="9">Nota ≥ 9</option></select>
  <select id="so" aria-label="Ordenar"><option value="added">Mais recentes</option><option value="title">Título (A-Z)</option><option value="rating">Nota</option><option value="progress">Progresso</option></select>
  <button class="btn" id="vw" aria-label="Alternar visualização">☰ Lista</button>
 </div>
 <div id="out"></div>
</section>
<section id="sts" hidden></section>
</div>

<dialog id="dlg" aria-labelledby="dt">
<form class="fm" id="fm">
 <h2 id="dt">Adicionar anime</h2>
 <div class="full"><label for="jq">Buscar no AniList</label>
  <div class="jk"><input id="jq" type="search" placeholder="Ex.: Frieren"><button type="button" class="btn" id="jb">Buscar</button></div>
  <ul class="jr" id="jr"></ul><div class="jm" id="jm" role="status"></div></div>
 <label class="full">Título<input id="f_title" required maxlength="120"></label>
 <label class="full">Capa (URL da imagem)<input id="f_cover" type="url" placeholder="https://…"></label>
 <label>Status<select id="f_status"></select></label>
 <label>Nota (0 a 10)<input id="f_rating" type="number" min="0" max="10" step="0.5"></label>
 <label>Episódios assistidos<input id="f_watched" type="number" min="0" value="0"></label>
 <label>Total de episódios<input id="f_total" type="number" min="0" value="12"></label>
 <label>Data de início<input id="f_start" type="date"></label>
 <label>Data de fim<input id="f_end" type="date"></label>
 <div class="full gsel"><span>Gêneros</span>
  <details id="gd"><summary id="gsum">Selecionar gêneros</summary><div class="gl" id="gl"></div></details>
  <input id="f_genres" placeholder="Outros gêneros (separe por vírgula)" aria-label="Gêneros escolhidos ou outros, separados por vírgula"></div>
 <label class="full">Comentário pessoal<textarea id="f_comment"></textarea></label>
 <div class="fa"><button type="button" class="btn" id="cx">Cancelar</button><button class="btn pri">Salvar</button></div>
</form>
</dialog>

<dialog id="ad" aria-labelledby="at">
<form class="am" id="af">
 <h2 id="at">Entrar na nuvem</h2>
 <p>Entre com o mesmo e-mail em todos os seus aparelhos para sincronizar a lista.</p>
 <label>E-mail<input id="ae" type="email" required autocomplete="email"></label>
 <label>Senha (mínimo 6 caracteres)<input id="ap" type="password" required minlength="6" autocomplete="current-password"></label>
 <div class="er" id="aer" role="alert"></div>
 <div class="fa"><button type="button" class="btn" id="acx">Cancelar</button><button type="button" class="btn" id="asu">Criar conta</button><button class="btn pri">Entrar</button></div>
</form>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== Dados e persistência (localStorage com fallback em memória) ===== */
const KEY='animeTracker.v1', ST={watching:'Assistindo',done:'Concluído',plan:'Planejo assistir',hold:'Pausado',drop:'Abandonado'};
let mem=null, items=[], view='grid', editId=null;
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
function save(){mem=items;try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}cloudPush()}
function sample(){const m=(title,status,w,t,r,g,fav,c,e)=>({id:uid(),title,cover:'',status,watched:w,total:t,rating:r,start:'2025-01-10',end:e||'',genres:g,comment:c,fav,added:Date.now()-Math.random()*1e9});
return[m('Fullmetal Alchemist: Brotherhood','done',64,64,10,['Ação','Aventura','Drama'],true,'Obra-prima absoluta.','2025-03-02'),
m('Frieren','done',28,28,9.5,['Fantasia','Drama'],true,'Lindo e melancólico.','2025-06-15'),
m('Jujutsu Kaisen','watching',30,47,8.5,['Ação','Sobrenatural'],false,'Lutas incríveis.'),
m('Cowboy Bebop','hold',12,26,8,['Ficção científica','Ação'],false,'Voltar quando tiver tempo.'),
m('Vinland Saga','plan',0,24,0,['Histórico','Ação'],false,'Recomendado por um amigo.')]}
items=load()||sample();save();

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=t=>[...t].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const pct=a=>a.total?Math.min(100,Math.round(a.watched/a.total*100)):(a.status==='done'?100:0);
const fmtD=d=>d?d.split('-').reverse().join('/'):'—';

/* ===== Biblioteca ===== */
function fillFilters(){
 const g=[...new Set(items.flatMap(a=>a.genres))].sort(), cur=$('#fg').value, cs=$('#fs').value;
 $('#fs').innerHTML='<option value="">Todos os status</option>'+Object.entries(ST).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
 $('#fg').innerHTML='<option value="">Todos os gêneros</option>'+g.map(x=>`<option>${esc(x)}</option>`).join('');
 $('#fs').value=cs;$('#fg').value=g.includes(cur)?cur:'';
}
function card(a){
 const p=pct(a), h=hue(a.title);
 const img=a.cover?`<img src="${esc(a.cover)}" alt="" loading="lazy" onerror="this.remove()">`:'';
 return `<article class="card" data-id="${a.id}">
 <div class="cv" style="background:linear-gradient(145deg,hsl(${h} 60% 40%),hsl(${(h+50)%360} 55% 22%))">${esc(a.title[0]||'?')}${img}
  <button class="fav ${a.fav?'on':''}" data-a="fav" aria-label="Favoritar" aria-pressed="${a.fav}">${a.fav?'♥':'♡'}</button>
  <span class="badge b-${a.status}">${ST[a.status]}</span></div>
 <div class="info"><div class="tt">${esc(a.title)}</div>
  <div class="meta"><span>${a.watched}/${a.total||'?'} ep</span><span>${a.rating?'★ '+a.rating:'sem nota'}</span></div>
  <div class="pg" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
  ${view==='list'?`<div class="meta"><span class="b-${a.status}">${ST[a.status]}</span><span>${fmtD(a.start)} → ${fmtD(a.end)}</span></div>`:''}
  <div class="tags">${a.genres.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
  ${a.comment&&view==='list'?`<div class="cm">“${esc(a.comment)}”</div>`:''}
  <div class="acts"><button class="btn" data-a="inc" aria-label="Mais um episódio">+1 ep</button><button class="btn" data-a="done" aria-label="Marcar como concluído">✓</button><button class="btn" data-a="edit" aria-label="Editar">✎</button><button class="btn" data-a="del" aria-label="Excluir">🗑</button></div>
 </div></article>`;
}
function render(){
 fillFilters();
 const q=$('#q').value.toLowerCase(),s=$('#fs').value,g=$('#fg').value,r=+$('#fr').value,so=$('#so').value;
 let l=items.filter(a=>a.title.toLowerCase().includes(q)&&(!s||a.status===s)&&(!g||a.genres.includes(g))&&a.rating>=r);
 const cmp={added:(a,b)=>b.added-a.added,title:(a,b)=>a.title.localeCompare(b.title,'pt'),rating:(a,b)=>b.rating-a.rating,progress:(a,b)=>pct(b)-pct(a)}[so];
 l.sort(cmp);
 $('#out').className=view==='list'?'list':'';
 $('#out').innerHTML=l.length?`<div class="grid">${l.map(card).join('')}</div>`:
  `<div class="empty"><div style="font-size:48px">📺</div><b>${items.length?'Nada encontrado':'Sua lista está vazia'}</b>${items.length?'Tente mudar os filtros.':'Toque em “Adicionar” para registrar seu primeiro anime.'}</div>`;
 $('#vw').textContent=view==='grid'?'☰ Lista':'▦ Grade';
 renderStats();
}
$('#out').addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const el=b.closest('.card'),a=items.find(x=>x.id===el.dataset.id),act=b.dataset.a;
 if(act==='fav')a.fav=!a.fav;
 else if(act==='inc'){if(a.total&&a.watched>=a.total)return;a.watched++;if(a.status!=='watching'&&a.status!=='done')a.status='watching';if(!a.start)a.start=today();if(a.total&&a.watched>=a.total){a.status='done';a.end=a.end||today()}}
 else if(act==='done'){if(a.total)a.watched=a.total;a.status='done';a.end=a.end||today()}
 else if(act==='edit')return openDlg(a);
 else if(act==='del'){if(!confirm('Excluir "'+a.title+'"?'))return;el.classList.add('out');return setTimeout(()=>{items=items.filter(x=>x!==a);save();render()},250)}
 save();render();
});
['q','fs','fg','fr','so'].forEach(i=>$('#'+i).addEventListener('input',render));
$('#vw').onclick=()=>{view=view==='grid'?'list':'grid';render()};

/* ===== Estatísticas ===== */
function bars(map,max){return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><div class="pg"><i style="width:${v/max*100}%"></i></div><b>${v}</b></div>`).join('')||'<span class="cm">Sem dados</span>'}
function renderStats(){
 const eps=items.reduce((s,a)=>s+a.watched,0),rated=items.filter(a=>a.rating>0),avg=rated.length?(rated.reduce((s,a)=>s+a.rating,0)/rated.length).toFixed(1):'—';
 const sm={},gm={};items.forEach(a=>{sm[ST[a.status]]=(sm[ST[a.status]]||0)+1;a.genres.forEach(x=>gm[x]=(gm[x]||0)+1)});
 const done=items.filter(a=>a.status==='done').sort((a,b)=>(b.end||'').localeCompare(a.end||'')).slice(0,6);
 $('#sts').innerHTML=`<div class="stats"><div class="st"><b>${items.length}</b><span>Animes</span></div><div class="st"><b>${eps}</b><span>Episódios assistidos</span></div><div class="st"><b>${Math.round(eps*24/60)}h</b><span>Horas estimadas</span></div><div class="st"><b>${avg}</b><span>Nota média</span></div></div>
 <div class="pan"><h2>Por status</h2>${bars(sm,Math.max(1,...Object.values(sm)))}</div>
 <div class="pan"><h2>Por gênero</h2>${bars(gm,Math.max(1,...Object.values(gm)))}</div>
 <div class="pan"><h2>Últimos concluídos</h2>${done.length?`<ul class="tl">${done.map(a=>`<li><b>${esc(a.title)}</b><br><span class="cm">${fmtD(a.end)}${a.rating?' · ★ '+a.rating:''}</span></li>`).join('')}</ul>`:'<span class="cm">Nenhum anime concluído ainda.</span>'}</div>`;
}
function tab(n){$('#lib').hidden=n!==1;$('#sts').hidden=n!==2;$('#t1').setAttribute('aria-selected',n===1);$('#t2').setAttribute('aria-selected',n===2)}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);

/* ===== Modal de cadastro / edição ===== */
const F=['title','cover','status','rating','watched','total','start','end','genres','comment'];
$('#f_status').innerHTML=Object.entries(ST).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
function openDlg(a){
 editId=a?a.id:null;$('#dt').textContent=a?'Editar anime':'Adicionar anime';
 const d=a||{title:'',cover:'',status:'plan',rating:'',watched:0,total:12,start:'',end:'',genres:[],comment:''};
 F.forEach(k=>$('#f_'+k).value=k==='genres'?d.genres.join(', '):(d[k]||(k==='watched'||k==='total'?0:'')));
 gsync();$('#gd').open=false;$('#jr').innerHTML='';$('#jm').textContent='';
 $('#dlg').showModal();$('#f_title').focus();
}
$('#add').onclick=()=>openDlg();$('#cx').onclick=()=>$('#dlg').close();
$('#fm').addEventListener('submit',e=>{
 e.preventDefault();const v={};F.forEach(k=>v[k]=$('#f_'+k).value.trim());
 const o={title:v.title,cover:v.cover,status:v.status,rating:Math.min(10,Math.max(0,+v.rating||0)),watched:+v.watched||0,total:+v.total||0,start:v.start,end:v.end,comment:v.comment,genres:v.genres.split(',').map(x=>x.trim()).filter(Boolean)};
 if(o.status==='done'&&o.total)o.watched=o.total;
 if(editId)Object.assign(items.find(x=>x.id===editId),o);else items.unshift({id:uid(),fav:false,added:Date.now(),...o});
 save();$('#dlg').close();render();
});

/* ===== Lista suspensa de gêneros (sincronizada com o campo de texto) ===== */
const GEN=['Ação','Aventura','Comédia','Drama','Fantasia','Ficção científica','Terror','Mistério','Romance','Cotidiano','Esportes','Sobrenatural','Psicológico','Suspense','Garota mágica','Música','Mecha','Histórico','Escolar','Shounen','Seinen','Isekai','Ecchi'];
$('#gl').innerHTML=GEN.map(g=>`<label class="ck"><input type="checkbox" value="${g}">${g}</label>`).join('');
const gget=()=>$('#f_genres').value.split(',').map(x=>x.trim()).filter(Boolean);
function gsync(){const l=gget().map(x=>x.toLowerCase());document.querySelectorAll('#gl input').forEach(c=>c.checked=l.includes(c.value.toLowerCase()));$('#gsum').textContent=l.length?l.length+' selecionado(s)':'Selecionar gêneros'}
$('#gl').addEventListener('change',e=>{const c=e.target,l=gget().filter(x=>x.toLowerCase()!==c.value.toLowerCase());if(c.checked)l.push(c.value);$('#f_genres').value=l.join(', ');gsync()});
$('#f_genres').addEventListener('input',gsync);

/* ===== Busca automática via AniList (GraphQL, sem chave) ===== */
const GPT={Action:'Ação',Adventure:'Aventura',Comedy:'Comédia',Fantasy:'Fantasia',Horror:'Terror',Mystery:'Mistério','Sci-Fi':'Ficção científica','Slice of Life':'Cotidiano',Sports:'Esportes',Supernatural:'Sobrenatural',Psychological:'Psicológico',Thriller:'Suspense','Mahou Shoujo':'Garota mágica',Music:'Música'};
const GQL='query($q:String){Page(perPage:6){media(search:$q,type:ANIME,sort:SEARCH_MATCH){id title{romaji english} coverImage{large medium} episodes seasonYear genres}}}';
let jres=[];
async function jikan(){
 const q=$('#jq').value.trim(),m=$('#jm'),ul=$('#jr');if(!q)return;
 ul.innerHTML='';m.textContent='Buscando…';
 try{
  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:GQL,variables:{q}})});
  if(!r.ok)throw new Error(r.status);
  jres=(await r.json()).data?.Page?.media||[];
  m.textContent=jres.length?'':'Nenhum resultado.';
  ul.innerHTML=jres.map((a,i)=>`<li><button type="button" data-i="${i}"><img src="${esc(a.coverImage?.medium)}" alt=""><span>${esc(a.title.english||a.title.romaji)}<small>${a.seasonYear||'—'} · ${a.episodes||'?'} ep</small></span></button></li>`).join('');
 }catch(e){const st=Number(e.message);m.textContent=st===429?'Muitas buscas seguidas. Aguarde alguns segundos e tente de novo.':st?'O AniList respondeu com erro '+st+'. Tente novamente em instantes.':'Sem conexão com o AniList ('+(e.message||e.name)+'). Abra o site por https:// (ex.: GitHub Pages).'}
}
$('#jb').onclick=jikan;
$('#jq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();jikan()}});
$('#jr').addEventListener('click',e=>{
 const b=e.target.closest('[data-i]');if(!b)return;const a=jres[+b.dataset.i];
 $('#f_title').value=a.title.english||a.title.romaji;
 $('#f_cover').value=a.coverImage?.large||a.coverImage?.medium||'';
 $('#f_total').value=a.episodes||0;
 $('#f_genres').value=(a.genres||[]).map(g=>GPT[g]||g).join(', ');
 gsync();$('#jr').innerHTML='';$('#jm').textContent='Dados preenchidos. Ajuste o que quiser e salve.';
});

/* ===== Exportar / importar JSON ===== */
$('#ex').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='animes.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;items=d.filter(a=>a&&a.title).map(a=>({id:uid(),fav:false,added:Date.now(),status:'plan',watched:0,total:0,rating:0,genres:[],comment:'',cover:'',start:'',end:'',...a,status:ST[a.status]?a.status:'plan'}));save();render()}catch(x){alert('Arquivo JSON inválido.')}};r.readAsText(f);e.target.value=''};

/* ===== Sincronização na nuvem (Firebase: login + Firestore) ===== */
/* Cole aqui a configuração do seu projeto Firebase (Configurações do projeto > Seus apps > Web). */
var FB_CONFIG={apiKey:"AIzaSyBT7Gy2qtEXWx83tW1y_zOJLGfU7ycQTh8",authDomain:"anime-tracker-13161.firebaseapp.com",projectId:"anime-tracker-13161",storageBucket:"anime-tracker-13161.firebasestorage.app",messagingSenderId:"1086665060525",appId:"1:1086665060525:web:66fc19ec5646972c819624"};
var cloudUid=null,cloudUnsub=null,cloudTimer=null,cloudRef=null,cloudAuth=null;
function cloudStatus(t){$('#cs').textContent=t}
function cloudPush(){
 if(!cloudUid||!cloudRef)return;
 clearTimeout(cloudTimer);cloudStatus('☁ Salvando…');
 cloudTimer=setTimeout(()=>cloudRef.set({items:JSON.stringify(items),updated:Date.now()}).then(()=>cloudStatus('☁ Sincronizado')).catch(e=>cloudStatus('☁ Erro ao salvar: '+(e.code||e.message))),600);
}
const AERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/email-already-in-use':'Este e-mail já tem conta. Toque em Entrar.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/invalid-email':'E-mail inválido.','auth/network-request-failed':'Sem conexão com a internet.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.'};
function cloudInit(){
 if(!FB_CONFIG.apiKey||!window.firebase)return;
 $('#cl').hidden=false;
 firebase.initializeApp(FB_CONFIG);cloudAuth=firebase.auth();const db=firebase.firestore();
 cloudAuth.onAuthStateChanged(u=>{
  if(cloudUnsub){cloudUnsub();cloudUnsub=null}
  cloudUid=u?u.uid:null;cloudRef=null;
  $('#cl').textContent=u?'☁ '+(u.email||'').split('@')[0]:'☁ Entrar';
  if(!u){cloudStatus('');return}
  cloudRef=db.collection('users').doc(u.uid);cloudStatus('☁ Conectando…');
  cloudUnsub=cloudRef.onSnapshot(snap=>{
   if(snap.metadata.hasPendingWrites)return;
   if(!snap.exists){cloudPush();return}            /* primeira vez: envia a lista local */
   try{const r=JSON.parse(snap.data().items);
    if(JSON.stringify(r)!==JSON.stringify(items)){items=r;mem=r;try{localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}render()}
    cloudStatus('☁ Sincronizado')}catch(e){cloudStatus('☁ Dados da nuvem inválidos')}
  },e=>cloudStatus('☁ Erro: '+(e.code||e.message)));
 });
}
$('#cl').onclick=()=>{
 if(cloudUid){if(confirm('Sair da conta? Seus dados continuam salvos na nuvem.'))cloudAuth.signOut();return}
 $('#aer').textContent='';$('#ad').showModal();$('#ae').focus();
};
$('#acx').onclick=()=>$('#ad').close();
async function authGo(create){
 const e=$('#ae').value.trim(),p=$('#ap').value;$('#aer').textContent='Aguarde…';
 try{await (create?cloudAuth.createUserWithEmailAndPassword(e,p):cloudAuth.signInWithEmailAndPassword(e,p));$('#ad').close();$('#ap').value=''}
 catch(x){$('#aer').textContent=AERR[x.code]||('Erro: '+(x.code||x.message))}
}
$('#af').addEventListener('submit',e=>{e.preventDefault();authGo(false)});
$('#asu').onclick=()=>{if($('#af').reportValidity())authGo(true)};

/* ===== Tema ===== */
$('#th').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':!matchMedia('(prefers-color-scheme: light)').matches;r.dataset.theme=dark?'light':'dark'};
render();cloudInit();
</script>
